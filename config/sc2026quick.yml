# SC2026 Quick-Test Configuration — LOCAL
# 10 SAT + 10 UNSAT benchmarks solved by kissat-sc2025 within 5 minutes.
# Use this to locally verify that all SC2026 solvers build and run correctly
# before submitting to the HPC cluster.

# Solver resource limits (5-minute budget)
solver_cputime: 300
solver_walltime: 360         # Wall time limit (20% headroom over 5 min)
solver_memory: 32768         # Memory limit for solvers in MB

# Checker resource limits
checker_cputime: 600         # CPU time limit for checkers in seconds
checker_walltime: 900        # Wall time limit for checkers in seconds
checker_memory: 32768        # Memory limit for checkers in MB

# Job scheduler configuration
scheduling:
  scheduler: local
  parallel: 4                # Number of solver jobs run in parallel
  jobname: sc2026quick       # Job name for scheduler

benchmarks:
  file: ./sc2026quick.instances.csv   # 20 quick-test benchmark hashes
  selection_method: allpairs          # Run every solver on every instance

# Benchmark and solver files
solvers: ./satcomp26.solvers.csv      # All SC2026 solver entries
results: ./sc2026quick.results        # Output directory for results
